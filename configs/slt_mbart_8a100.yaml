defaults:
  - base_slt_mbart
  - override modules: dinov2_base_tconv
  - override data: ph14t_*x224x224
  - override engine: adam_multi_step

data:
  batch_size: 2
  batch_size_val_test: 4

max_epochs: 140
devices: [2, 3, 4, 5, 6, 7]
precision: bf16-mixed

datamodule:
  num_workers: 8

engine:
  optimizer:
    lr: 1e-4

visual_text_alignment_weight: 4.0
log_interval: 10
