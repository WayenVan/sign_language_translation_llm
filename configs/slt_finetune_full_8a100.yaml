defaults:
  - base_slt_fintune

data:
  batch_size: 8
  batch_size_val_test: 4

max_epochs: 80
devices: [2, 3, 4, 5, 6, 7]
precision: bf16-mixed

datamodule:
  num_workers: 8

engine:
  optimizer:
    lr: 2e-5
lr_scheduler:
  instance:
    _target_: torch.optim.lr_scheduler.StepLR
    step_size: 2

visual_text_alignment_weight: 4.0
pretrained_checkpoint: outputs/t5_text_pretrain_8a100/2025-06-18_19-56-11/epoch=79-val_generate_bleu=0.5015-blo6e98y.ckpt

full_tuning: true
ckpt: outputs/slt_finetune_8a100/2025-06-19_03-50-22/epoch=70-val_generate_bleu=0.2507-sui4ukom.ckpt
