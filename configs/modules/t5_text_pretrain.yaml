num_global_tokens: 20

t5_model_name: google/flan-t5-base

backbone:
  _target_: modules.VitPoseVisualEncoder
  id: usyd-community/vitpose-plus-base
  hidden_states_layer: -2

visual_adapter:
  _target_: modules.TokenSampleAdapter
  hidden_size: 768
  target_hidden_size: 768
  num_heads: 12
  num_layers: 2
  num_extra_queries: 4
  attn_drop: 0.1
  proj_drop: 0.1

visual_encoder_layer_scale: 2
connector_depth: 1
